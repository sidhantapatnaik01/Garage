<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maruti Care Nabarangapur — Car Repair & Restoration</title>
  <meta name="description" content="Nabarangapur's trusted garage for Maruti Suzuki Arena car repair. Dent repair, scratch removal, bumper restoration, body polishing and more."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #060606; color: #fff;
      overflow-x: hidden;
    }
    ::selection { background: rgba(230,57,70,0.3); color: #fff; }

    /* ── Responsive nav ── */
    @media (max-width: 768px) {
      .desktop-nav { display: none !important; }
      .mobile-menu-btn { display: block !important; }
    }

    /* ── Scroll reveal ── */
    .scroll-reveal {
      opacity: 0; transform: translateY(32px);
      transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1), transform 0.8s cubic-bezier(0.4,0,0.2,1);
    }
    .scroll-reveal.visible { opacity: 1; transform: translateY(0); }

    /* ── Keyframes ── */
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes particleFloat {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-100vh) translateX(40px); opacity: 0; }
    }
    @keyframes scrollDot {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(12px); opacity: 1; }
    }
    @keyframes meshRotate {
      from { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(360deg); }
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 4px 16px rgba(230,57,70,0.4); }
      50% { box-shadow: 0 4px 28px rgba(230,57,70,0.6); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); max-height: 0; }
      to { opacity: 1; transform: translateY(0); max-height: 200px; }
    }
    @keyframes fadeScale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 0.8; transform: scale(1); }
    }
    @keyframes damagePulse {
      0%, 100% { opacity: 0.5; transform: scale(1); box-shadow: 0 0 10px rgba(230,57,70,0.2); }
      50% { opacity: 1; transform: scale(1.4); box-shadow: 0 0 25px rgba(230,57,70,0.4); }
    }
    @keyframes handleGlow {
      0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 0 rgba(255,255,255,0); }
      50% { box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px 4px rgba(255,255,255,0.1); }
    }
    @keyframes borderGlow {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.25; }
    }
    @keyframes starPop {
      from { transform: scale(0) rotate(-20deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes shineSweep {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    /* ── Hover interactions ── */
    .nav-link::after {
      content: ''; display: block; width: 0; height: 1.5px;
      background: #e63946; transition: width 0.3s cubic-bezier(0.4,0,0.2,1);
      margin-top: 2px;
    }
    .nav-link:hover::after { width: 100%; }
    .nav-link:hover { color: #fff !important; }

    .nav-cta-btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%); transition: transform 0.6s;
    }
    .nav-cta-btn:hover::before { transform: translateX(100%); }
    .nav-cta-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 30px rgba(230,57,70,0.5); }

    .hero-btn-primary:hover { transform: translateY(-2px) !important; box-shadow: 0 12px 48px rgba(230,57,70,0.45) !important; }
    .hero-btn-secondary:hover { background: rgba(255,255,255,0.08) !important; border-color: rgba(255,255,255,0.2) !important; }

    .service-card:hover { box-shadow: 0 16px 48px rgba(0,0,0,0.3); }
    .trust-card:hover { background: rgba(255,255,255,0.03) !important; border-color: rgba(230,57,70,0.1) !important; transform: translateX(4px); }

    .contact-card:hover { background: rgba(255,255,255,0.03) !important; border-color: rgba(230,57,70,0.15) !important; transform: translateY(-2px); }

    .upload-area:hover { border-color: rgba(230,57,70,0.3) !important; background: rgba(230,57,70,0.04) !important; }
    .submit-btn:hover { transform: translateY(-2px); }

    .footer-link:hover { color: #e63946 !important; transform: translateX(2px); }

    .gallery-card:hover { transform: scale(1.02); }

    /* Auto-scrolling shine on car cards */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { scrollbar-width: none; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #060606; }
    ::-webkit-scrollbar-thumb { background: rgba(230,57,70,0.25); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(230,57,70,0.5); }

    /* ── Floating CTA ── */
    .floating-cta {
      position: fixed; bottom: 24px; right: 24px; z-index: 900;
      background: linear-gradient(135deg, #e63946, #c62828);
      color: #fff; padding: 14px 24px; border-radius: 16px;
      font-size: 14px; font-weight: 800; text-decoration: none;
      box-shadow: 0 8px 40px rgba(230,57,70,0.4);
      display: flex; align-items: center; gap: 8;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      animation: floatingCTA 3s ease-in-out infinite;
    }
    @keyframes floatingCTA {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .floating-cta:hover { transform: translateY(-4px) scale(1.05) !important; box-shadow: 0 16px 56px rgba(230,57,70,0.5); }
    @media (max-width: 768px) {
      .floating-cta { bottom: 16px; right: 16px; padding: 12px 18px; font-size: 13px; border-radius: 14px; }
    }

    /* ── Smooth section transitions ── */
    section { position: relative; }
    section::before {
      content: ''; position: absolute; top: -1px; left: 0; right: 0; height: 80px;
      background: linear-gradient(to bottom, rgba(6,6,6,0.8), transparent);
      pointer-events: none; z-index: 1;
    }
    section:first-of-type::before { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="sections-top.jsx"></script>
  <script type="text/babel" src="sections-mid.jsx"></script>
  <script type="text/babel" src="sections-bottom.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentColor": "#e63946",
      "heroStyle": "particles",
      "animationSpeed": "normal"
    }/*EDITMODE-END*/;

    function App() {
      const tweaks = useTweaks(TWEAK_DEFAULTS);

      // Scroll reveal observer
      React.useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) entry.target.classList.add('visible');
          });
        }, { threshold: 0.06, rootMargin: '0px 0px -30px 0px' });

        const observe = () => {
          document.querySelectorAll('.scroll-reveal:not(.visible)').forEach(el => observer.observe(el));
        };
        observe();
        // Re-observe on DOM changes
        const mo = new MutationObserver(observe);
        mo.observe(document.getElementById('root'), { childList: true, subtree: true });

        return () => { observer.disconnect(); mo.disconnect(); };
      }, []);

      return (
        <React.Fragment>
          <Header />
          <Hero />
          <CarModels />
          <BeforeAfter />
          <Services />
          <HowItWorks />
          <WhyChooseUs />
          <Gallery />
          <Testimonials />
          <Contact />
          <Footer />

          <a href="#contact" className="floating-cta">
            📞 Free Estimate
          </a>

          <TweaksPanel title="Customise">
            <TweakSection title="Theme">
              <TweakColor label="Accent Color" value={tweaks.accentColor} onChange={v => tweaks.set('accentColor', v)} />
              <TweakRadio label="Hero Effect" value={tweaks.heroStyle} onChange={v => tweaks.set('heroStyle', v)}
                options={[{value:'particles',label:'Particles'},{value:'gradient',label:'Gradient'},{value:'minimal',label:'Minimal'}]} />
              <TweakRadio label="Animation Speed" value={tweaks.animationSpeed} onChange={v => tweaks.set('animationSpeed', v)}
                options={[{value:'slow',label:'Slow'},{value:'normal',label:'Normal'},{value:'fast',label:'Fast'}]} />
            </TweakSection>
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
